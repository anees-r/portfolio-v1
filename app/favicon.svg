<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Works on both light & dark browser chrome:
    - Dark circle bg always shows, so the lavender A pops on any tab bar color
  -->
  <circle cx="16" cy="16" r="16" fill="#0d0b12"/>
  <!--
    Italic serif "A" hand-drawn as path (no font dependency).
    Approximates DM Serif Display italic proportions.
  -->
  <path
    d="M9 24 L15.2 8.5 Q16 6.8 16.8 8.5 L23 24 M11.5 18.5 L20.5 18.5"
    stroke="#b48fff"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>
